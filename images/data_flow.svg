<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <!-- boxes -->
  <g font-size="15" fill="#263238" text-anchor="middle">
    <rect x="20" y="105" width="130" height="80" rx="12" fill="#E3F2FD" stroke="#1E6FD9"/>
    <text x="85" y="140" font-weight="bold">태그</text>
    <text x="85" y="162" font-size="12" fill="#546E7A">BLE CTE 송신</text>

    <rect x="210" y="105" width="150" height="80" rx="12" fill="#E3F2FD" stroke="#1E6FD9"/>
    <text x="285" y="140" font-weight="bold">로케이터 ×4</text>
    <text x="285" y="162" font-size="12" fill="#546E7A">방위·앙각 측정</text>

    <rect x="420" y="80" width="200" height="130" rx="12" fill="#ECEFF1" stroke="#455A64"/>
    <text x="520" y="112" font-weight="bold">서버 카드</text>
    <text x="520" y="136" font-size="12" fill="#546E7A">MQTT 브로커</text>
    <text x="520" y="156" font-size="12" fill="#546E7A">위치 계산 (각도 → x,y,z)</text>
    <text x="520" y="176" font-size="12" fill="#546E7A">외부망 중계 (선택)</text>

    <rect x="690" y="105" width="190" height="80" rx="12" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="785" y="140" font-weight="bold">고객 소프트웨어</text>
    <text x="785" y="162" font-size="12" fill="#546E7A">관제 · MES · WMS · 앱</text>
  </g>
  <!-- arrows -->
  <g stroke="#37474F" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="150" y1="145" x2="205" y2="145"/>
    <line x1="360" y1="145" x2="415" y2="145"/>
    <line x1="620" y1="145" x2="685" y2="145"/>
  </g>
  <g font-size="12" fill="#37474F" text-anchor="middle">
    <text x="177" y="135">무선</text>
    <text x="388" y="135">LAN</text>
  </g>
  <!-- customer topics -->
  <g font-size="12.5" fill="#1B5E20">
    <text x="640" y="238">controlbit/aoa/position/&lt;그룹&gt;/&lt;태그&gt;  · x, y, z (m)</text>
    <text x="640" y="258">controlbit/aoa/angle/&lt;로케이터&gt;/&lt;태그&gt;  · 방위·앙각 (°)</text>
  </g>
  <line x1="652" y1="150" x2="652" y2="222" stroke="#2E7D32" stroke-dasharray="4 3"/>
  <text x="450" y="40" font-size="18" font-weight="bold" fill="#263238" text-anchor="middle">LocationX 데이터 흐름</text>
  <text x="450" y="62" font-size="12" fill="#607D8B" text-anchor="middle">고객 시스템은 서버 카드 브로커(tcp://서버IP:1883)의 controlbit/# 만 구독하면 됩니다</text>
</svg>
